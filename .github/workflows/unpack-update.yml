name: Unpack uploaded update packages

on:
  push:
    branches: [main]
    paths:
      - 'uploads/*.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unpack-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract uploaded ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(uploads/*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "No ZIP packages found."
            exit 0
          fi

          for archive in "${archives[@]}"; do
            echo "Validating ${archive}"
            while IFS= read -r entry; do
              [[ -z "$entry" ]] && continue
              if [[ "$entry" == /* || "/$entry/" == *"/../"* ]]; then
                echo "Unsafe archive path: $entry" >&2
                exit 1
              fi
            done < <(unzip -Z1 "$archive")

            echo "Extracting ${archive} into repository root"
            unzip -o "$archive" -d .
            rm -f "$archive"
          done

          mkdir -p uploads
          touch uploads/.gitkeep

      - name: Commit extracted changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes to commit."
          else
            git commit -m "Apply uploaded project update package"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the static GitHub Pages deployment
        if: steps.commit.outputs.created == 'true' && hashFiles('.github/workflows/pages.yml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
